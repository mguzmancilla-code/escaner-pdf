<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- AgneScan: documento PDF dentro del marco de escaneo, con la línea de luz -->
  <defs>
    <linearGradient id="marco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fe8"/>
      <stop offset="1" stop-color="#22c3e6"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6effb"/>
    </linearGradient>
    <linearGradient id="banda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80f2"/>
      <stop offset="1" stop-color="#1546c9"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" x2="1">
      <stop offset="0" stop-color="#4fe3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6eeeff"/>
      <stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="brillo" x="-10%" y="-200%" width="120%" height="500%">
